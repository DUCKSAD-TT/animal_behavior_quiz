  <style>
    :root {
      --forest-deep: #122b21;
      --forest-mid: #1f5c46;
      --forest-leaf: #2f7a5c;
      --moss: #6fbf8b;
      --moss-soft: #a9dcbb;
      --mist: #eef7ef;
      --sun: #e8b94a;
      --berry: #c0564f;
    }

    * { box-sizing: border-box; }
    html { background: #dcefe1; }
    body {
      margin: 0;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      width: 100%;
      font-family: "Nunito Sans", sans-serif;
      color: var(--forest-deep);
      background:
        radial-gradient(ellipse 900px 500px at 15% -5%, rgba(111, 191, 139, .35), transparent 60%),
        radial-gradient(ellipse 800px 600px at 100% 100%, rgba(31, 92, 70, .25), transparent 55%),
        linear-gradient(180deg, #eef7ef 0%, #dcefe1 100%);
      overflow-x: hidden;
    }

    button, input { font: inherit; }

    .app-stage {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      position: relative;
      overflow: hidden;
    }

    .leaf-deco {
      position: fixed;
      pointer-events: none;
      opacity: .52;
      z-index: 0;
    }

    .leaf-top { top: -42px; left: -42px; width: 220px; transform: rotate(-16deg); }
    .leaf-bottom { bottom: -60px; right: -50px; width: 260px; transform: rotate(200deg); }

    .quiz-stage {
      width: 100%;
      max-width: 600px;
      position: relative;
      z-index: 1;
      animation: rise-in .6s ease both;
    }

    .quiz-card {
      background: #fff;
      border: 1px solid rgba(31, 92, 70, .08);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 30px 60px -25px rgba(18, 43, 33, .35), 0 2px 0 rgba(18, 43, 33, .04) inset;
    }

    .forest-header {
      background: linear-gradient(135deg, #1f5c46, #122b21);
      padding: 22px 26px 20px;
      color: var(--mist);
    }

    .game-title {
      font-family: Fraunces, serif;
      margin: 0 0 2px;
      line-height: 1.2;
    }

    .tagline {
      margin: 0;
      color: var(--moss-soft);
    }

    .vine-track {
      height: 10px;
      border-radius: 999px;
      margin-top: 16px;
      overflow: hidden;
      background: rgba(255, 255, 255, .14);
    }

    .vine-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--moss), var(--sun));
      transition: width .45s ease;
    }

    .progress-row {
      margin-top: 8px;
      color: var(--moss-soft);
      font-size: .78rem;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .quiz-body { padding: 26px; }

    .topic-label {
      color: var(--forest-leaf);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .3px;
      margin: 0 0 10px;
    }

    .question-text {
      min-height: 88px;
      font-family: Fraunces, serif;
      font-size: 1.28rem;
      font-weight: 600;
      line-height: 1.5;
      margin: 0 0 20px;
    }

    .choice-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .choice {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1.5px solid #d7e9dc;
      border-radius: 14px;
      background: #f7fbf8;
      color: var(--forest-deep);
      cursor: pointer;
      padding: 14px 16px;
      text-align: left;
      transition: border-color .15s ease, background .15s ease, transform .1s ease;
    }

    .choice:hover:not(:disabled) {
      border-color: var(--moss);
      background: #eef8f0;
      transform: translateY(-1px);
    }

    .choice:focus-visible,
    .forest-button:focus-visible {
      outline: 3px solid rgba(232, 185, 74, .9);
      outline-offset: 3px;
    }

    .choice:disabled { cursor: default; }

    .choice-tag {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #dff0e3;
      color: var(--forest-mid);
      font-size: .8rem;
      font-weight: 800;
    }

    .choice.correct {
      background: #e2f3e6;
      border-color: var(--forest-leaf);
    }

    .choice.correct .choice-tag {
      color: #fff;
      background: var(--forest-leaf);
    }

    .choice.wrong {
      background: #fbeae9;
      border-color: var(--berry);
    }

    .choice.wrong .choice-tag {
      color: #fff;
      background: var(--berry);
    }

    .feedback {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      color: var(--forest-deep);
      font-size: .9rem;
      line-height: 1.55;
    }

    .feedback.show { display: block; animation: fade-in .25s ease both; }
    .feedback.right { background: #e2f3e6; border-left: 4px solid var(--forest-leaf); }
    .feedback.miss { background: #fbeae9; border-left: 4px solid var(--berry); }

    .forest-button {
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
      transition: transform .15s ease, background .15s ease, opacity .15s ease;
    }

    .forest-button:hover { transform: translateY(-2px); }
    .forest-button:active { transform: translateY(0); }

    .next-button {
      display: none;
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      color: #fff;
      background: #122b21;
    }

    .next-button:hover { background: #1f5c46; }
    .next-button.show { display: block; animation: fade-in .22s ease both; }

    .panel {
      padding: 38px 30px 34px;
      text-align: center;
    }

    .badge-icon {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6fbf8b, #2f7a5c);
      color: #fff;
      box-shadow: 0 12px 24px -8px rgba(47, 122, 92, .5);
    }

    .badge-icon svg { width: 34px; height: 34px; }

    .panel-title {
      font-family: Fraunces, serif;
      color: var(--forest-deep);
      margin: 0 0 10px;
      line-height: 1.25;
    }

    .panel-copy {
      max-width: 430px;
      margin: 0 auto 26px;
      color: #4c6559;
      line-height: 1.65;
    }

    .pill-button {
      padding: 14px 34px;
      color: #fff;
      background: #122b21;
      border-radius: 999px;
    }

    .pill-button:hover { background: #1f5c46; }

    .score-big {
      margin: 6px 0 2px;
      font-family: Fraunces, serif;
      color: var(--forest-mid);
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .score-sub {
      margin: 0 0 20px;
      color: #5c7a6c;
      font-size: .9rem;
    }

    .rank-chip {
      display: inline-block;
      margin-bottom: 22px;
      padding: 6px 16px;
      border-radius: 999px;
      background: #dff0e3;
      color: var(--forest-mid);
      font-size: .82rem;
      font-weight: 800;
    }

    .hidden { display: none !important; }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      .app-stage { padding: 18px 12px; }
      .panel { padding: 30px 20px; }
      .forest-header, .quiz-body { padding: 20px; }
      .question-text { font-size: 1.12rem; min-height: 84px; }
    }
  </style>

        explain: "การพรางตัวช่วยให้สัตว์กลมกลืนกับสภาพแวดล้อม จึงช่วยหลบผู้ล่าหรือเข้าใกล้เหยื่อได้ดีขึ้น"

    const letters = ["ก", "ข", "ค", "ง"];
    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const endScreen = document.getElementById("end-screen");
    const topicLabel = document.getElementById("topic-label");
    const questionText = document.getElementById("question-text");
    const choicesBox = document.getElementById("choices-box");
    const feedbackBox = document.getElementById("feedback-box");
    const nextButton = document.getElementById("next-button");
    const vineFill = document.getElementById("vine-fill");
    const progressText = document.getElementById("progress-text");
    const scoreText = document.getElementById("score-text");
    const finalScore = document.getElementById("final-score");
    const rankChip = document.getElementById("rank-chip");

    function startQuiz() {
      currentQuestion = 0;
      score = 0;
      answered = false;
      startScreen.classList.add("hidden");
      endScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      renderQuestion();
    }

    function renderQuestion() {
      const item = questions[currentQuestion];
      answered = false;

      topicLabel.textContent = item.topic;
      questionText.textContent = item.q;
      progressText.textContent = `ข้อ ${currentQuestion + 1} / ${questions.length}`;
      scoreText.textContent = `คะแนน ${score}`;
      vineFill.style.width = `${(currentQuestion / questions.length) * 100}%`;

      feedbackBox.className = "feedback";
      feedbackBox.textContent = "";
      nextButton.classList.remove("show");
      choicesBox.replaceChildren();

      item.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.innerHTML = `<span class="choice-tag">${letters[index]}</span><span>${choice}</span>`;
        button.addEventListener("click", () => chooseAnswer(index));
        choicesBox.appendChild(button);
      });
    }

    function chooseAnswer(selectedIndex) {
      if (answered) return;
      answered = true;

      const item = questions[currentQuestion];
      const choices = Array.from(choicesBox.querySelectorAll(".choice"));
      const correct = selectedIndex === item.answer;

      choices.forEach((button, index) => {
        button.disabled = true;
        if (index === item.answer) button.classList.add("correct");
        if (index === selectedIndex && !correct) button.classList.add("wrong");
      });

      if (correct) {
        score += 1;
        feedbackBox.className = "feedback show right";
        feedbackBox.innerHTML = `<strong>ถูกต้อง! </strong>${item.explain}`;
      } else {
        feedbackBox.className = "feedback show miss";
        feedbackBox.innerHTML = `<strong>ยังไม่ถูกนะ </strong>${item.explain}`;
      }

      scoreText.textContent = `คะแนน ${score}`;
      nextButton.classList.add("show");
      nextButton.focus();
    }

    function nextQuestion() {
      if (!answered) return;

      if (currentQuestion < questions.length - 1) {
        currentQuestion += 1;
        renderQuestion();
        return;
      }

      showResults();
    }

    function showResults() {
      quizScreen.classList.add("hidden");
      endScreen.classList.remove("hidden");
      vineFill.style.width = "100%";
      finalScore.textContent = `${score}/${questions.length}`;

      let rank = "นักสำรวจป่า";
      if (score === questions.length) rank = "ผู้พิทักษ์ผืนป่า";
      else if (score >= 12) rank = "นักธรรมชาติวิทยา";
      else if (score >= 8) rank = "ผู้สังเกตการณ์ป่า";
      else if (score >= 4) rank = "นักเดินป่ามือใหม่";

      rankChip.textContent = rank;
    }

    document.getElementById("start-button").addEventListener("click", startQuiz);
    document.getElementById("next-button").addEventListener("click", nextQuestion);
    document.getElementById("retry-button").addEventListener("click", startQuiz);

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
