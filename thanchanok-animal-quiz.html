<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ป่าแห่งพฤติกรรม | เกมทายพฤติกรรมสัตว์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --forest-deep:#122b21;
    --forest-mid:#1f5c46;
    --forest-leaf:#2f7a5c;
    --moss:#6fbf8b;
    --moss-soft:#a9dcbb;
    --mist:#eef7ef;
    --sun:#e8b94a;
    --berry:#c0564f;
    --bark:#3a2c22;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Nunito Sans', sans-serif;
    color:var(--forest-deep);
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(111,191,139,0.35), transparent 60%),
      radial-gradient(ellipse 800px 600px at 100% 100%, rgba(31,92,70,0.25), transparent 55%),
      linear-gradient(180deg, #eef7ef 0%, #dcefe1 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    position:relative;
    overflow-x:hidden;
  }
  .leaf-deco{
    position:fixed;
    pointer-events:none;
    opacity:0.5;
    z-index:0;
  }
  .leaf-deco.tl{top:-40px;left:-40px;width:220px;transform:rotate(-15deg);}
  .leaf-deco.br{bottom:-60px;right:-50px;width:260px;transform:rotate(200deg);}

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:600px;
  }

  .card{
    background:#ffffff;
    border-radius:26px;
    box-shadow:0 30px 60px -25px rgba(18,43,33,0.35), 0 2px 0 rgba(18,43,33,0.04) inset;
    border:1px solid rgba(31,92,70,0.08);
    overflow:hidden;
  }

  header.top{
    background:linear-gradient(135deg, var(--forest-mid), var(--forest-deep));
    padding:22px 26px 20px;
    color:var(--mist);
    position:relative;
  }
  header.top h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.5rem;
    margin:0 0 2px;
    letter-spacing:0.2px;
  }
  header.top p.tagline{
    margin:0;
    font-size:0.85rem;
    color:var(--moss-soft);
  }

  .vine-track{
    margin-top:16px;
    height:10px;
    border-radius:999px;
    background:rgba(255,255,255,0.14);
    overflow:hidden;
    position:relative;
  }
  .vine-fill{
    height:100%;
    background:linear-gradient(90deg, var(--moss), var(--sun));
    border-radius:999px;
    transition:width .5s ease;
  }
  .progress-label{
    margin-top:8px;
    font-size:0.78rem;
    color:var(--moss-soft);
    display:flex;
    justify-content:space-between;
  }

  main.body{
    padding:26px;
  }

  .q-count{
    font-size:0.78rem;
    font-weight:800;
    color:var(--forest-leaf);
    letter-spacing:0.3px;
    margin-bottom:10px;
  }
  .question{
    font-family:'Fraunces', serif;
    font-size:1.28rem;
    line-height:1.5;
    font-weight:600;
    color:var(--forest-deep);
    margin:0 0 20px;
  }

  .choices{
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .choice{
    text-align:left;
    padding:14px 16px;
    border-radius:14px;
    border:1.5px solid #d7e9dc;
    background:#f7fbf8;
    font-family:'Nunito Sans', sans-serif;
    font-size:0.98rem;
    color:var(--forest-deep);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
    width:100%;
  }
  .choice .tag{
    flex:0 0 auto;
    width:26px;height:26px;
    border-radius:50%;
    background:#dff0e3;
    color:var(--forest-mid);
    font-weight:800;
    font-size:0.8rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .choice:hover:not(:disabled){
    border-color:var(--moss);
    background:#eef8f0;
    transform:translateY(-1px);
  }
  .choice:disabled{cursor:default;}
  .choice.correct{
    border-color:var(--forest-leaf);
    background:#e2f3e6;
  }
  .choice.correct .tag{background:var(--forest-leaf);color:#fff;}
  .choice.wrong{
    border-color:var(--berry);
    background:#fbeae9;
  }
  .choice.wrong .tag{background:var(--berry);color:#fff;}

  .feedback{
    margin-top:16px;
    padding:14px 16px;
    border-radius:14px;
    font-size:0.9rem;
    line-height:1.55;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.right{background:#e2f3e6;color:var(--forest-deep);border-left:4px solid var(--forest-leaf);}
  .feedback.miss{background:#fbeae9;color:var(--forest-deep);border-left:4px solid var(--berry);}
  .feedback b{color:var(--forest-mid);}

  .next-btn{
    margin-top:18px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:var(--forest-deep);
    color:#fff;
    font-family:'Nunito Sans', sans-serif;
    font-weight:800;
    font-size:0.98rem;
    cursor:pointer;
    display:none;
    transition:background .15s ease;
  }
  .next-btn:hover{background:var(--forest-mid);}
  .next-btn.show{display:block;}

  /* Start & End screens */
  .panel{
    padding:38px 30px 34px;
    text-align:center;
  }
  .badge-icon{
    width:76px;height:76px;
    margin:0 auto 18px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--moss), var(--forest-leaf));
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;
    box-shadow:0 12px 24px -8px rgba(47,122,92,0.5);
  }
  .panel h2{
    font-family:'Fraunces', serif;
    font-size:1.6rem;
    margin:0 0 10px;
    color:var(--forest-deep);
  }
  .panel p{
    color:#4c6559;
    font-size:0.95rem;
    line-height:1.6;
    max-width:420px;
    margin:0 auto 26px;
  }
  .start-btn, .retry-btn{
    padding:14px 34px;
    border:none;
    border-radius:999px;
    background:var(--forest-deep);
    color:#fff;
    font-weight:800;
    font-size:1rem;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .start-btn:hover, .retry-btn:hover{background:var(--forest-mid);transform:translateY(-2px);}

  .score-big{
    font-family:'Fraunces', serif;
    font-size:3.2rem;
    font-weight:700;
    color:var(--forest-mid);
    margin:6px 0 2px;
  }
  .score-sub{
    font-size:0.9rem;
    color:#5c7a6c;
    margin-bottom:24px;
  }
  .rank-chip{
    display:inline-block;
    padding:6px 16px;
    border-radius:999px;
    background:#dff0e3;
    color:var(--forest-mid);
    font-weight:800;
    font-size:0.82rem;
    margin-bottom:22px;
  }

  .hidden{display:none !important;}

  @media (max-width:420px){
    .panel{padding:30px 20px;}
    header.top{padding:18px 20px;}
    main.body{padding:20px;}
    .question{font-size:1.12rem;}
  }
</style>
</head>
<body>

<svg class="leaf-deco tl" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M10 190C10 100 60 20 190 10C180 130 110 190 10 190Z" fill="#6fbf8b" opacity="0.35"/>
</svg>
<svg class="leaf-deco br" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M10 190C10 100 60 20 190 10C180 130 110 190 10 190Z" fill="#1f5c46" opacity="0.3"/>
</svg>

<div class="stage">
  <div class="card">

    <!-- START SCREEN -->
    <div id="startScreen" class="panel">
      <div class="badge-icon">🌿</div>
      <h2>ป่าแห่งพฤติกรรม</h2>
      <p>ทดสอบความเข้าใจเรื่อง "พฤติกรรมของสัตว์" 15 ข้อ ครอบคลุมพฤติกรรมแต่กำเนิด พฤติกรรมจากการเรียนรู้ และพฤติกรรมทางสังคม พร้อมคำอธิบายท้ายทุกข้อ</p>
      <button class="start-btn" onclick="startQuiz()">เริ่มผจญป่า</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quizScreen" class="hidden">
      <header class="top">
        <h1>ป่าแห่งพฤติกรรม</h1>
        <p class="tagline">เกมทายพฤติกรรมสัตว์</p>
        <div class="vine-track"><div class="vine-fill" id="vineFill" style="width:0%"></div></div>
        <div class="progress-label">
          <span id="progressText">ข้อ 1 / 15</span>
          <span id="scoreText">คะแนน 0</span>
        </div>
      </header>
      <main class="body">
        <div class="q-count" id="topicLabel">หัวข้อ</div>
        <p class="question" id="questionText">คำถาม</p>
        <div class="choices" id="choicesBox"></div>
        <div class="feedback" id="feedbackBox"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">ข้อถัดไป →</button>
      </main>
    </div>

    <!-- END SCREEN -->
    <div id="endScreen" class="panel hidden">
      <div class="badge-icon">🍃</div>
      <h2>สรุปผลการผจญป่า</h2>
      <div class="score-big" id="finalScore">0/15</div>
      <div class="score-sub">คำตอบที่ถูกต้อง</div>
      <div class="rank-chip" id="rankChip">นักสำรวจป่า</div>
      <br>
      <button class="retry-btn" onclick="restartQuiz()">ลองอีกครั้ง</button>
    </div>

  </div>
</div>

<script>
const questions = [
  {
    topic: "พฤติกรรมแต่กำเนิด",
    q: "การที่แมลงบินเข้าหาแสงไฟในเวลากลางคืน เป็นพฤติกรรมประเภทใด",
    choices: ["รีเฟล็กซ์ (Reflex)", "แทกซิส (Taxis)", "คิเนซิส (Kinesis)", "การเรียนรู้แบบลองผิดลองถูก"],
    answer: 1,
    explain: "แทกซิส (Taxis) คือการเคลื่อนที่เข้าหาหรือหนีสิ่งเร้าอย่างมีทิศทางแน่นอน เช่น ผีเสื้อกลางคืนบินเข้าหาแสงไฟ เรียกว่า phototaxis"
  },
  {
    topic: "พฤติกรรมแต่กำเนิด",
    q: "มดหรือแมลงที่เคลื่อนที่เร็วขึ้นเมื่ออยู่ในที่แห้งแล้งเพื่อหาความชื้น โดยไม่มีทิศทางตายตัว จัดเป็นพฤติกรรมแบบใด",
    choices: ["Taxis", "Kinesis", "Imprinting", "Fixed Action Pattern"],
    answer: 1,
    explain: "Kinesis คือการเปลี่ยนอัตราเร็วของการเคลื่อนที่ตอบสนองต่อสิ่งเร้า แต่ไม่มีทิศทางที่แน่นอนเหมือน Taxis"
  },
  {
    topic: "พฤติกรรมแต่กำเนิด",
    q: "เมื่อแตะขาของนกกระเรียนขณะฟักไข่แล้วนกยกขาหนีทันที เป็นตัวอย่างของพฤติกรรมชนิดใด",
    choices: ["รีเฟล็กซ์ (Reflex)", "Imprinting", "Insight Learning", "Habituation"],
    answer: 0,
    explain: "รีเฟล็กซ์เป็นการตอบสนองอย่างรวดเร็วและอัตโนมัติต่อสิ่งเร้า ควบคุมผ่านไขสันหลังโดยไม่ผ่านการคิดของสมองส่วนบน"
  },
  {
    topic: "พฤติกรรมแต่กำเนิด",
    q: "แม่นกบางชนิดจะกกไข่ที่หล่นออกจากรังโดยกลิ้งกลับเข้ารังด้วยลำดับขั้นตอนที่ตายตัวทุกครั้ง แม้ไข่จะหลุดมืออีกระหว่างทางก็ยังทำจนจบขั้นตอน พฤติกรรมนี้เรียกว่าอะไร",
    choices: ["Fixed Action Pattern (FAP)", "Operant Conditioning", "Trial and Error", "Imitation"],
    answer: 0,
    explain: "Fixed Action Pattern คือพฤติกรรมแต่กำเนิดที่เมื่อเริ่มแล้วจะดำเนินไปตามลำดับขั้นตอนตายตัวจนจบ แม้สิ่งเร้าจะหายไประหว่างทาง"
  },
  {
    topic: "พฤติกรรมจากการเรียนรู้",
    q: "ลูกห่านที่ฟักออกจากไข่แล้วเดินตามสิ่งเคลื่อนไหวชิ้นแรกที่เห็น แม้จะเป็นมนุษย์แทนแม่ห่าน เป็นการค้นพบของนักวิทยาศาสตร์ท่านใด และเรียกพฤติกรรมนี้ว่าอะไร",
    choices: ["พาฟลอฟ - Conditioning", "สกินเนอร์ - Operant Learning", "ลอเรนซ์ - Imprinting", "ฟอน ฟริช - Communication"],
    answer: 2,
    explain: "คอนราด ลอเรนซ์ (Konrad Lorenz) ศึกษาพฤติกรรม Imprinting หรือการฝังใจในลูกห่าน ซึ่งเกิดขึ้นในช่วงเวลาวิกฤต (critical period) หลังฟักไข่"
  },
  {
    topic: "พฤติกรรมจากการเรียนรู้",
    q: "หอยทากที่หดตัวเมื่อถูกสัมผัสครั้งแรก แต่เมื่อถูกสัมผัสซ้ำๆ โดยไม่เป็นอันตราย จะค่อยๆ ไม่หดตัวอีก พฤติกรรมนี้เรียกว่าอะไร",
    choices: ["Habituation", "Sensitization", "Imprinting", "Latent Learning"],
    answer: 0,
    explain: "Habituation (การเคยชิน) คือการที่สัตว์เรียนรู้ที่จะลดหรือหยุดการตอบสนองต่อสิ่งเร้าที่ไม่เป็นอันตรายและเกิดขึ้นซ้ำๆ"
  },
  {
    topic: "พฤติกรรมจากการเรียนรู้",
    q: "การที่สุนัขของพาฟลอฟน้ำลายไหลเมื่อได้ยินเสียงกระดิ่ง หลังจากถูกฝึกให้เสียงกระดิ่งดังพร้อมกับให้อาหารซ้ำๆ จัดเป็นการเรียนรู้แบบใด",
    choices: ["Operant Conditioning", "Classical Conditioning", "Insight Learning", "Habituation"],
    answer: 1,
    explain: "Classical Conditioning (การวางเงื่อนไขแบบคลาสสิก) เป็นการเชื่อมโยงสิ่งเร้าที่เป็นกลาง (เสียงกระดิ่ง) เข้ากับสิ่งเร้าที่ก่อให้เกิดการตอบสนองตามธรรมชาติ (อาหาร) จนเสียงกระดิ่งเพียงอย่างเดียวก็กระตุ้นการตอบสนองได้"
  },
  {
    topic: "พฤติกรรมจากการเรียนรู้",
    q: "หนูที่กดคันโยกในกล่องทดลองแล้วได้รับอาหารเป็นรางวัล ทำให้กดคันโยกบ่อยขึ้นเรื่อยๆ เป็นตัวอย่างของการเรียนรู้แบบใด ตามแนวคิดของสกินเนอร์",
    choices: ["Classical Conditioning", "Operant Conditioning", "Imprinting", "Habituation"],
    answer: 1,
    explain: "Operant Conditioning คือการเรียนรู้จากผลของการกระทำ พฤติกรรมที่ได้รับรางวัล (reinforcement) มีแนวโน้มจะเกิดซ้ำมากขึ้น"
  },
  {
    topic: "พฤติกรรมจากการเรียนรู้",
    q: "ลิงชิมแปนซีที่มองเห็นกล้วยแขวนอยู่สูงเกินเอื้อม แล้วจู่ๆ ก็นำกล่องมาวางซ้อนกันเพื่อปีนขึ้นไปหยิบ โดยไม่เคยลองผิดลองถูกมาก่อน เป็นพฤติกรรมประเภทใด",
    choices: ["Trial and Error", "Insight Learning", "Imprinting", "Habituation"],
    answer: 1,
    explain: "Insight Learning (การหยั่งรู้) คือการแก้ปัญหาอย่างฉับพลันโดยอาศัยการมองเห็นความสัมพันธ์ขององค์ประกอบต่างๆ ในสถานการณ์ พบมากในสัตว์ที่มีสมองพัฒนาสูง เช่น ไพรเมต"
  },
  {
    topic: "พฤติกรรมจากการเรียนรู้",
    q: "การที่ลูกนกเรียนรู้เพลงร้องที่ถูกต้องของสปีชีส์ตนเองได้ก็ต่อเมื่อได้ยินเสียงร้องของพ่อแม่ในช่วงอายุหนึ่งเท่านั้น หากพ้นช่วงนี้ไปแล้วจะไม่สามารถเรียนรู้ได้อีก แสดงถึงแนวคิดใด",
    choices: ["Operant Conditioning", "Critical Period", "Habituation", "Latent Learning"],
    answer: 1,
    explain: "Critical Period (ช่วงเวลาวิกฤต) คือช่วงเวลาที่จำกัดในการพัฒนาที่สัตว์จะเรียนรู้พฤติกรรมบางอย่างได้ดีที่สุด หากพ้นช่วงนี้ไปการเรียนรู้จะยากขึ้นมากหรือเกิดขึ้นไม่ได้เลย"
  },
  {
    topic: "พฤติกรรมทางสังคม",
    q: "ผึ้งงานที่กลับมาจากแหล่งอาหารแล้วเต้นรำเป็นรูปเลขแปด (waggle dance) เพื่อบอกทิศทางและระยะทางของแหล่งอาหารแก่ผึ้งตัวอื่น เป็นการสื่อสารที่ค้นพบโดยใคร",
    choices: ["คอนราด ลอเรนซ์", "อีวาน พาฟลอฟ", "คาร์ล ฟอน ฟริช", "บี.เอฟ. สกินเนอร์"],
    answer: 2,
    explain: "คาร์ล ฟอน ฟริช (Karl von Frisch) เป็นผู้ค้นพบและถอดรหัสภาษาเต้นรำของผึ้ง (bee dance language) ซึ่งบอกทั้งทิศทางและระยะทางของแหล่งอาหาร"
  },
  {

let currentIndex = 0;
let score = 0;
let answered = false;

const startScreen = document.getElementById('startScreen');
const quizScreen = document.getElementById('quizScreen');
const endScreen = document.getElementById('endScreen');
const vineFill = document.getElementById('vineFill');
const progressText = document.getElementById('progressText');
const scoreText = document.getElementById('scoreText');
const topicLabel = document.getElementById('topicLabel');
const questionText = document.getElementById('questionText');
const choicesBox = document.getElementById('choicesBox');
const feedbackBox = document.getElementById('feedbackBox');
const nextBtn = document.getElementById('nextBtn');
const finalScore = document.getElementById('finalScore');
const rankChip = document.getElementById('rankChip');

const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

function startQuiz(){
  currentIndex = 0;
  score = 0;
  startScreen.classList.add('hidden');
  endScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const item = questions[currentIndex];

  topicLabel.textContent = item.topic;
  questionText.textContent = item.q;

  const progressPct = (currentIndex / questions.length) * 100;
  vineFill.style.width = progressPct + '%';
  progressText.textContent = `ข้อ ${currentIndex + 1} / ${questions.length}`;
  scoreText.textContent = `คะแนน ${score}`;

  choicesBox.innerHTML = '';
  item.choices.forEach((choiceLabel, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `<span class="tag">${letters[idx]}</span><span>${choiceLabel}</span>`;
    btn.onclick = () => selectAnswer(idx);
    choicesBox.appendChild(btn);
  });

  feedbackBox.className = 'feedback';
  feedbackBox.textContent = '';
  nextBtn.classList.remove('show');
}

function selectAnswer(idx){
  if(answered) return;
  answered = true;

  const item = questions[currentIndex];
  const buttons = choicesBox.querySelectorAll('.choice');
  buttons.forEach(b => b.disabled = true);

  const isCorrect = idx === item.answer;
  if(isCorrect){
    score++;
    buttons[idx].classList.add('correct');
  } else {
    buttons[idx].classList.add('wrong');
    buttons[item.answer].classList.add('correct');
  }

  scoreText.textContent = `คะแนน ${score}`;

  feedbackBox.classList.add('show');
  if(isCorrect){
    feedbackBox.classList.add('right');
    feedbackBox.classList.remove('miss');
    feedbackBox.innerHTML = `<b>ถูกต้อง!</b> ${item.explain}`;
  } else {
    feedbackBox.classList.add('miss');
    feedbackBox.classList.remove('right');
    feedbackBox.innerHTML = `<b>คำตอบที่ถูกคือ "${item.choices[item.answer]}"</b><br>${item.explain}`;
  }

  nextBtn.classList.add('show');
  nextBtn.textContent = (currentIndex === questions.length - 1) ? 'ดูผลสรุป →' : 'ข้อถัดไป →';
}

function nextQuestion(){
  currentIndex++;
  if(currentIndex >= questions.length){
    showEndScreen();
  } else {
    renderQuestion();
  }
}

function showEndScreen(){
  vineFill.style.width = '100%';
  quizScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');
  finalScore.textContent = `${score}/${questions.length}`;

  let rank = 'นักสำรวจป่า';
  const pct = score / questions.length;
  if(pct === 1){
    rank = 'ปรมาจารย์แห่งป่า 🌟';
  } else if(pct >= 0.8){
    rank = 'ผู้เชี่ยวชาญพฤติกรรมสัตว์';
  } else if(pct >= 0.6){
    rank = 'นักสำรวจผู้ช่ำชอง';
  } else if(pct >= 0.4){
    rank = 'นักสำรวจฝึกหัด';
  } else {
    rank = 'ผู้เริ่มต้นสำรวจป่า';
  }
  rankChip.textContent = rank;
}

function restartQuiz(){
  startQuiz();
}
</script>
