<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมพฤติกรรมสัตว์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --forest-deep:#122b21;
    --forest-mid:#1f5c46;
    --forest-leaf:#2f7a5c;
    --moss:#6fbf8b;
    --moss-soft:#a9dcbb;
    --mist:#eef7ef;
    --sun:#e8b94a;
    --berry:#c0564f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;font-family:'Nunito Sans', sans-serif;color:var(--forest-deep);
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(111,191,139,0.35), transparent 60%),
      radial-gradient(ellipse 800px 600px at 100% 100%, rgba(31,92,70,0.25), transparent 55%),
      linear-gradient(180deg, #eef7ef 0%, #dcefe1 100%);
    display:flex;align-items:center;justify-content:center;padding:28px 16px;
    position:relative;overflow-x:hidden;
  }
  .leaf-deco{position:fixed;pointer-events:none;opacity:0.5;z-index:0;}
  .leaf-deco.tl{top:-40px;left:-40px;width:220px;transform:rotate(-15deg);}
  .leaf-deco.br{bottom:-60px;right:-50px;width:260px;transform:rotate(200deg);}

  .stage{position:relative;z-index:1;width:100%;max-width:600px;}
  .card{
    background:#ffffff;border-radius:26px;
    box-shadow:0 30px 60px -25px rgba(18,43,33,0.35), 0 2px 0 rgba(18,43,33,0.04) inset;
    border:1px solid rgba(31,92,70,0.08);overflow:hidden;position:relative;
  }

  header.top{
    background:linear-gradient(135deg, var(--forest-mid), var(--forest-deep));
    padding:16px 20px 14px;color:var(--mist);
  }
  .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  header.top h1{font-family:'Fraunces', serif;font-weight:600;font-size:1.2rem;margin:0;letter-spacing:0.2px;}
  .help-btn{
    background:rgba(255,255,255,0.15);border:none;color:var(--mist);border-radius:999px;
    padding:5px 12px;font-size:0.78rem;font-weight:800;cursor:pointer;
  }
  .score-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:6px;font-size:0.78rem;color:var(--moss-soft);font-weight:700;
  }
  .hearts{letter-spacing:2px;font-size:0.9rem;}

  /* ===== 3D VIEWPORT ===== */
  #canvasWrap{
    position:relative;width:100%;height:360px;overflow:hidden;
    background:linear-gradient(180deg,#bfe3d6 0%,#dff0e3 55%,#eef7ef 100%);
  }
  #gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #badgeLayer{position:absolute;inset:0;pointer-events:none;}
  .loading-3d{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:8px;color:var(--forest-mid);font-weight:800;font-size:0.85rem;
    background:linear-gradient(180deg,#bfe3d6 0%,#dff0e3 55%,#eef7ef 100%);
  }
  .loading-3d .spin{width:26px;height:26px;border:3px solid #cfe9d6;border-top-color:var(--forest-leaf);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .node-btn{
    position:absolute;width:28px;height:28px;margin-left:-14px;margin-top:-14px;
    border-radius:50%;border:2px solid rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:0.72rem;font-family:'Nunito Sans',sans-serif;
    box-shadow:0 3px 6px rgba(18,43,33,0.25);transition:opacity .15s ease;
  }
  .node-btn.locked{background:#c3d3c9;color:#5c7a6c;}
  .node-btn.current{background:var(--sun);color:#5c4413;animation:pulseGlow 1.4s ease-in-out infinite;}
  .node-btn.done-correct{background:var(--forest-leaf);color:#fff;}
  .node-btn.done-wrong{background:var(--berry);color:#fff;}
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(232,185,74,0.65);}
    50%{box-shadow:0 0 0 9px rgba(232,185,74,0);}
  }

  /* ===== D-PAD (walk controller) ===== */
  .dpad-wrap{display:flex;justify-content:center;align-items:center;padding:14px 18px 8px;gap:6px;}
  .dpad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:44px 44px;gap:5px;}
  .dbtn{
    border:none;border-radius:12px;background:var(--forest-deep);color:#fff;
    font-size:1.05rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:background .15s ease, transform .1s ease;line-height:1;gap:2px;font-weight:800;
  }
  .dbtn span.lbl{font-size:0.58rem;font-weight:800;letter-spacing:0.2px;}
  .dbtn:active:not(:disabled){transform:scale(0.92);}
  .dbtn:disabled{background:#dde8e0;color:#a9bcb0;cursor:default;}
  .dbtn.fwd{grid-column:1 / span 3;grid-row:1;}
  .dbtn.left{grid-column:1;grid-row:2;}
  .dbtn.back{grid-column:2;grid-row:2;}
  .dbtn.right{grid-column:3;grid-row:2;}
  .dpad-hint{font-size:0.76rem;color:#5c7a6c;text-align:center;padding:0 20px 14px;}

  /* ===== MODAL (question / help) ===== */
  .modal-overlay{
    position:absolute;inset:0;background:rgba(18,43,33,0.55);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:5;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-card{
    background:#fff;width:100%;border-radius:24px 24px 0 0;padding:22px 22px 26px;
    max-height:90%;overflow-y:auto;transform:translateY(24px);transition:transform .25s ease;
  }
  .modal-overlay.open .modal-card{transform:translateY(0);}

  .timer-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .timer-num{font-family:'Fraunces', serif;font-weight:700;font-size:1.05rem;color:var(--forest-mid);min-width:30px;text-align:center;}
  .timer-track{flex:1;height:10px;border-radius:999px;background:#e4f1e7;overflow:hidden;}
  .timer-fill{height:100%;border-radius:999px;background:var(--moss);transition:width 1s linear, background .3s ease;}
  .timer-fill.warn{background:var(--sun);}
  .timer-fill.danger{background:var(--berry);}

  .q-count{font-size:0.78rem;font-weight:800;color:var(--forest-leaf);letter-spacing:0.3px;margin-bottom:8px;}
  .question{font-family:'Fraunces', serif;font-size:1.2rem;line-height:1.5;font-weight:600;color:var(--forest-deep);margin:0 0 18px;}
  .choices{display:flex;flex-direction:column;gap:11px;}
  .choice{
    text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid #d7e9dc;background:#f7fbf8;
    font-family:'Nunito Sans', sans-serif;font-size:0.98rem;color:var(--forest-deep);
    cursor:pointer;display:flex;align-items:center;gap:12px;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;width:100%;
  }
  .choice .tag{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#dff0e3;color:var(--forest-mid);
    font-weight:800;font-size:0.8rem;display:flex;align-items:center;justify-content:center;
  }
  .choice:hover:not(:disabled){border-color:var(--moss);background:#eef8f0;transform:translateY(-1px);}
  .choice:disabled{cursor:default;}
  .choice.correct{border-color:var(--forest-leaf);background:#e2f3e6;}
  .choice.correct .tag{background:var(--forest-leaf);color:#fff;}
  .choice.wrong{border-color:var(--berry);background:#fbeae9;}
  .choice.wrong .tag{background:var(--berry);color:#fff;}

  .popup{
    margin-top:14px;padding:12px 16px;border-radius:14px;font-size:0.86rem;line-height:1.5;
    font-weight:700;display:none;align-items:center;gap:8px;
  }
  .popup.show{display:flex;}
  .popup.right{background:#e2f3e6;color:var(--forest-mid);border-left:4px solid var(--forest-leaf);}
  .popup.miss{background:#fbeae9;color:var(--berry);border-left:4px solid var(--berry);}
  .popup .pts{margin-left:auto;font-family:'Fraunces', serif;font-size:1rem;}

  .continue-btn{
    margin-top:16px;width:100%;padding:13px;border:none;border-radius:14px;
    background:var(--forest-deep);color:#fff;font-weight:800;font-size:0.95rem;cursor:pointer;display:none;
  }
  .continue-btn.show{display:block;}

  .help-content{text-align:left;font-size:0.9rem;line-height:1.85;color:var(--forest-deep);}
  .help-content h3{font-family:'Fraunces', serif;margin:0 0 10px;font-size:1.2rem;color:var(--forest-mid);}
  .help-close{
    margin-top:16px;width:100%;padding:13px;border:none;border-radius:14px;
    background:var(--forest-deep);color:#fff;font-weight:800;font-size:0.95rem;cursor:pointer;
  }

  /* ===== PANELS ===== */
  .panel{padding:38px 30px 34px;text-align:center;}
  .badge-icon{
    width:76px;height:76px;margin:0 auto 18px;border-radius:50%;
    background:linear-gradient(135deg, var(--moss), var(--forest-leaf));
    display:flex;align-items:center;justify-content:center;font-size:2rem;
    box-shadow:0 12px 24px -8px rgba(47,122,92,0.5);
  }
  .panel h2{font-family:'Fraunces', serif;font-size:1.6rem;margin:0 0 10px;color:var(--forest-deep);}
  .panel p{color:#4c6559;font-size:0.95rem;line-height:1.6;max-width:420px;margin:0 auto 22px;}
  .rules{
    text-align:left;background:#f4faf5;border-radius:14px;padding:14px 18px;
    max-width:420px;margin:0 auto 24px;font-size:0.88rem;line-height:1.9;color:var(--forest-deep);
  }
  .start-btn, .retry-btn{
    padding:14px 34px;border:none;border-radius:999px;background:var(--forest-deep);
    color:#fff;font-weight:800;font-size:1rem;cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .start-btn:hover, .retry-btn:hover{background:var(--forest-mid);transform:translateY(-2px);}

  .score-big{font-family:'Fraunces', serif;font-size:3rem;font-weight:700;color:var(--forest-mid);margin:6px 0 2px;}
  .score-sub{font-size:0.9rem;color:#5c7a6c;margin-bottom:18px;}
  .rank-chip{
    display:inline-block;padding:6px 16px;border-radius:999px;background:#dff0e3;
    color:var(--forest-mid);font-weight:800;font-size:0.82rem;margin-bottom:20px;
  }
  .toggle-review{
    background:none;border:none;color:var(--forest-leaf);font-weight:800;font-si
